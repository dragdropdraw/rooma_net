name: Collect, Test and Upload V2Ray Configs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect Raw Configs
        run: python collector.py

      - name: Download & Run LiteSpeedTest
        run: |
          # پیدا کردن هوشمند لینک آخرین نسخه LiteSpeedTest بدون خطا
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/xxf098/LiteSpeedTest/releases/latest | grep "browser_download_url.*linux-amd64.*\.gz" | cut -d '"' -f 4 | head -n 1)
          curl -L -o lite.gz "$DOWNLOAD_URL"
          gzip -df lite.gz
          chmod +x lite
          echo '{"group":"job","speedtestMode":"pingonly","pingMethod":"googleping","sortMethod":"rspeed","concurrency":50,"testMode":2,"subscription":"raw_configs.txt","timeout":8,"language":"en","fontSize":24,"theme":"rainbow","unique":true,"outputMode":0}' > config.json
          ./lite --config config.json --test raw_configs.txt || true

      - name: Filter Top 100 & Encode
        run: python filter_top.py

      - name: Upload to Host via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/raw_configs.txt
            **/output.json
            **/lite
            **/*.py
            **/config.json
