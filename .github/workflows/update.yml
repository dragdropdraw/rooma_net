name: Collect, Test and Upload V2Ray Configs

on:
  schedule:
    - cron: '0 * * * *' # اجرا در دقیقه صفر هر ساعت
  workflow_dispatch: # امکان اجرای دستی برای تست

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect Raw Configs
        run: python collector.py

      - name: Download & Run LiteSpeedTest
        run: |
          wget -O lite.gz https://github.com/xxf098/LiteSpeedTest/releases/latest/download/lite-linux-amd64.gz
          gzip -d lite.gz
          chmod +x lite
          # ساخت فایل تنظیمات تست (فقط تست پینگ واقعی، بدون تست سرعت دانلود سنگین برای سرعت بیشتر)
          echo '{"group":"job","speedtestMode":"pingonly","pingMethod":"googleping","sortMethod":"rspeed","concurrency":50,"testMode":2,"subscription":"raw_configs.txt","timeout":8,"language":"en","fontSize":24,"theme":"rainbow","unique":true,"outputMode":0}' > config.json
          ./lite --config config.json --test raw_configs.txt || true

      - name: Filter Top 100 & Encode
        run: python filter_top.py

      - name: Upload to Host via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/raw_configs.txt
            **/output.json
            **/lite
            **/*.py
            **/config.json
