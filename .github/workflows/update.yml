name: Collect, Test and Upload V2Ray Configs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect Raw Configs
        run: python collector.py

      - name: Test, Filter Top 100 and Encode
        run: python filter_top.py

      - name: Upload to Host via HTTP
        run: |
          curl -X POST http://roomanet.50m.ir/upload.php \
            -F "key=${{ secrets.FTP_PASSWORD }}" \
            --form-string "data=$(cat sub.txt)"
